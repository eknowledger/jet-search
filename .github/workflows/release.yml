name: Release

# Pushing a tag that is exactly the version in manifest.json (for example 0.6.0, no "v")
# checks, builds the plugin and publishes a release with the three files Obsidian installs.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag against the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          fi
          node -e "const v=require('./versions.json'); if(!v['${GITHUB_REF_NAME}']){console.error('versions.json has no entry for ${GITHUB_REF_NAME}');process.exit(1)}"

      - run: npm ci

      # The same formatting, lint, type and test gates as every push, so a tag cannot ship what CI would reject.
      - run: npm run check

      - run: npm run build

      - name: Attest the build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
