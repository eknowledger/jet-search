name: Release

# Pushing a tag that is exactly the version in manifest.json (for example 0.6.0, no "v")
# checks, builds the plugin and publishes a release with the three files Obsidian installs.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Check the tag against the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          fi
          node -e "const v=require('./versions.json'); if(!v['${GITHUB_REF_NAME}']){console.error('versions.json has no entry for ${GITHUB_REF_NAME}');process.exit(1)}"

      - run: npm ci

      # The same formatting, lint, type and test gates as every push, so a tag cannot ship what CI would reject.
      - run: npm run check

      - run: npm run build

      - name: Attest the build
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the short lines of this version's CHANGELOG.md section, not the commit list.
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
