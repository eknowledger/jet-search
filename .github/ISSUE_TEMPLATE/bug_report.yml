name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. A screenshot or a short recording helps.
    validations:
      required: true
  - type: textarea
    id: support
    attributes:
      label: Support info
      description: |
        Filled in for you when you open this form with "Open on GitHub" in Jet's Report issue window. Otherwise run "Jet Search: Copy support info" in the command palette and paste it here as it is. It holds versions, your device, timings and counts, and no note names or search text unless you tick them. For a slow or intermittent problem, record a trace first (Settings, Advanced, Trace).
      placeholder: Paste the support info here
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Jet Search, Obsidian and your operating system (Settings, About). Filled in for you, or skip it if you pasted the support info.
      placeholder: "Jet 0.6.0, Obsidian 1.15.1, macOS 26"
  - type: input
    id: size
    attributes:
      label: Vault size
      description: About how many notes, and the main languages.
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the developer console (Ctrl/Cmd + Shift + I) and paste any red lines.
      render: text
