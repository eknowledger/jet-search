# Weekly updates for the GitHub Actions the workflows pin by commit, and for dev dependencies.
#
# The release workflow can write to the repository and attest builds, so every action it runs is
# inside that trust boundary. Dependabot keeps each pinned commit and its version comment in step.
#
# Patch and minor updates share one pull request per ecosystem and majors stay separate so they get
# read. The open pull request count is capped so the queue stays readable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions-patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    allow:
      - dependency-type: "development"
    ignore:
      # The type checker is the separate typescript-7 package. The linter's parser does not run on
      # TypeScript 7 yet, so typescript itself stays on 6 until typescript-eslint supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
